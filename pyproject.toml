[project]
name = "pr-reviewer"
version = "0.1.0"
description = "PR 智能审查与总结工具（项目一）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "gitpython>=3.1",
    "chromadb>=0.5",
    "openai>=1.55",
    "httpx>=0.28",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
local = ["ollama>=0.3"]  # Ollama 本地后端按需安装
embed = ["sentence-transformers>=3.3"]  # EMBEDDING_BACKEND=local（源码不出机器）
# 真实语料评测用（scripts/ 里的 CWE + Bandit 链路）：不进 CI，也不进服务运行时
# scipy 原来只是 threshold_sweep 里的隐式依赖（靠 chromadb 传递带进来的），一并声明
eval = ["bandit>=1.9", "scipy>=1.11"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]
extend-exclude = [".venv", ".chroma", "reports", "tests/fixtures"]

[tool.ruff.lint]
# E/W 风格、F 正确性（未定义名、未用导入）、I 导入排序、B/BLE 常见陷阱与裸 except、
# UP 现代化语法、SIM 可简化写法、RUF ruff 自有规则
select = ["E", "W", "F", "I", "B", "BLE", "UP", "SIM", "RUF"]
ignore = [
    "E501",     # 行宽交给格式化，注释里中文宽度本来就难对齐
    "RUF001",   # 中文全角标点在字符串里是正常的，不是笔误
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]        # 探针/评测脚本必须先补 sys.path 再导入项目模块

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true       # chromadb / git / sentence-transformers 等无 stub
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pr_reviewer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".*", "fixtures"]
asyncio_mode = "auto"
