[project]
name = "pr-reviewer"
version = "0.1.0"
description = "PR 智能审查与总结工具（项目一）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "gitpython>=3.1",
    "chromadb>=0.5",
    "openai>=1.55",
    "httpx>=0.28",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
local = ["ollama>=0.3"]  # Ollama 本地后端按需安装
embed = ["sentence-transformers>=3.3"]  # EMBEDDING_BACKEND=local（源码不出机器）

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pr_reviewer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".*", "fixtures"]
asyncio_mode = "auto"
